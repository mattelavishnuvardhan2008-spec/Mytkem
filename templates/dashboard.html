<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TKREC Attendance</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="top-nav">
        CRAFTED BY <strong>VISHNU</strong>
    </header>

    <main class="dashboard-container">
        <!-- Student Header -->
        <div class="user-card">
            <div class="avatar">{{ data.name[0] | upper }}</div>
            <div class="user-info">
                <h2>{{ data.name }}</h2>
                <p>Roll: {{ data.roll }}</p>
            </div>
        </div>

        <!-- Attendance Stats Card -->
        <section class="card">
            <h3 style="text-align: center; margin-bottom: 15px; color: var(--accent-gold);">
                {{ data.percentage }}% Overall Attendance
            </h3>
            <div class="stats-grid">
                <div class="stat-box">
                    <span class="num">{{ data.held }}</span>
                    <span class="lbl">Held</span>
                </div>
                <div class="stat-box">
                    <span class="num green">{{ data.present }}</span>
                    <span class="lbl">Present</span>
                </div>
                <div class="stat-box">
                    <span class="num red">{{ data.absent }}</span>
                    <span class="lbl">Absent</span>
                </div>
            </div>
        </section>

        <!-- Calculator Card -->
        <section class="card">
            <h3>Attendance Target Calculator</h3>
            <div class="form-group" style="margin-top: 15px;">
                <label for="targetPct" style="font-size: 0.85rem; color: var(--text-muted);">Target Percentage</label>
                <input type="number" id="targetPct" value="75" min="50" max="100">
            </div>
            <button id="calcBtn" onclick="calculateTarget()">Calculate Target</button>
            
            <div class="preset-buttons">
                <button onclick="setTarget(65)">65%</button>
                <button onclick="setTarget(75)">75%</button>
                <button onclick="setTarget(85)">85%</button>
                <button onclick="setTarget(90)">90%</button>
            </div>

            <div id="targetResult" style="margin-top: 15px; text-align: center; font-size: 0.95rem;"></div>
        </section>
    </main>

    <script>
        const initialData = {
            held: {{ data.held }},
            present: {{ data.present }},
            percentage: {{ data.percentage }}
        };

        function setTarget(val) {
            document.getElementById('targetPct').value = val;
            calculateTarget();
        }

        function calculateTarget() {
            const target = parseFloat(document.getElementById('targetPct').value);
            const resultBox = document.getElementById('targetResult');
            
            if (isNaN(target) || target <= 0 || target > 100) {
                resultBox.innerHTML = "<p class='red'>Enter a target between 1 and 100.</p>";
                return;
            }

            const held = initialData.held;
            const present = initialData.present;
            const currentPct = (present / held) * 100;

            if (currentPct >= target) {
                const safeMiss = Math.floor((present - (target / 100) * held) / (target / 100));
                resultBox.innerHTML = `<p class="green">You are above target! You can safely skip <strong>${Math.max(0, safeMiss)}</strong> class(es) while staying above ${target}%.</p>`;
            } else {
                const reqAttend = Math.ceil(((target / 100) * held - present) / (1 - (target / 100)));
                resultBox.innerHTML = `<p class="red">You need to attend <strong>${Math.max(0, reqAttend)}</strong> consecutive class(es) to reach ${target}%.</p>`;
            }
        }

        document.addEventListener('DOMContentLoaded', calculateTarget);
    </script>
</body>
</html>
